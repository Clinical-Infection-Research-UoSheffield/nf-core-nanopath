<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Fonts/icons are loaded from the system (offline-safe); the report's CSS already
         falls back to Arial, Helvetica, sans-serif so no CDN download is needed. -->
    <style>body{font-family:Arial,Helvetica,sans-serif}</style>
    <title>{{ title }}</title>
    {{ resources }}
    {{ script }}
</head>
<body style="line-height: 1;">
  <div class="navbar navbar-branded mb-4">
      <div class="container" style="flex-wrap: nowrap;">
        <div>
          <h1>{{ title }}</h1>
          <p class="lead">{{ lead }}</p>
        </div>
        <div class="float-right">
            <img src="{{ logo }}"
            style="object-fit:contain;
                     width:200px;
                     height:auto;"
            alt="UoS logo"></img>
        </div>
      </div>
  </div>
  <div class="container mt-4">
          {{ div }}
</body>
</html>
